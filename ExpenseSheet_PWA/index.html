<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Expense Sheet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6fa;color:#182230}
.app{max-width:900px;margin:auto;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e6ed;padding:14px 14px 10px}
.title{font-size:21px;font-weight:800}.month{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#eef2f7;color:#182230}button.primary{background:#2563eb;color:white}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.card{background:#fff;border:1px solid #e2e6ed;border-radius:16px;padding:13px}.label{font-size:12px;color:#697386}.value{font-size:21px;font-weight:850;margin-top:4px}
.toolbar{display:flex;gap:8px;padding:0 14px 12px}.toolbar button{flex:1}
.sheet-wrap{margin:0 14px;background:#fff;border:1px solid #dfe4eb;border-radius:16px;overflow:hidden}
.sheet-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid #e6e9ef;border-right:1px solid #e6e9ef;padding:9px 8px;height:44px}
th{background:#edf3ff;font-size:13px;position:sticky;top:0;z-index:2;white-space:nowrap}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;z-index:3;min-width:155px;text-align:left}
th:first-child{background:#edf3ff;z-index:4}
td.amount{text-align:right;min-width:92px}td.total{font-weight:800;background:#f7f9fc;text-align:right;min-width:105px}
input.cell{width:100%;border:0;outline:0;background:transparent;text-align:right;font-size:15px;min-width:75px}
input.cell:focus{background:#eef5ff;border-radius:6px}
.totalrow td{font-weight:850;background:#e9f6ea}.totalrow td:first-child{background:#e9f6ea}
.empty{padding:25px;text-align:center;color:#6b7280}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e1e5eb;padding:9px 14px;display:flex;gap:8px;justify-content:center;z-index:20}
.bottom button{flex:1;max-width:220px}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end}.modal.show{display:flex}
.panel{background:#fff;width:100%;max-width:700px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
h2{margin:0 0 14px;font-size:19px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #d8dde6;border-radius:11px;font-size:16px}
.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}
.report{margin:14px}.report-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e7e9ee}
@media(min-width:700px){.bottom{position:static;background:transparent;border:0}.panel{border-radius:20px}.modal{align-items:center}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="title">💰 Expense Sheet</div>
  <div class="month">
    <button onclick="changeMonth(-1)">‹</button>
    <strong id="monthLabel"></strong>
    <button onclick="changeMonth(1)">›</button>
  </div>
</header>

<div class="summary">
  <div class="card"><div class="label">Month Total</div><div class="value" id="monthTotal">₹0</div></div>
  <div class="card"><div class="label">Grand Total</div><div class="value" id="grandTotal">₹0</div></div>
</div>

<div class="toolbar">
  <button class="primary" onclick="addRow()">＋ Add Expense</button>
  <button onclick="openPeople()">👤 Persons</button>
  <button onclick="openReport()">📊 Report</button>
</div>

<div class="sheet-wrap">
<div class="sheet-scroll">
<table id="sheet">
<thead><tr id="headRow"></tr></thead>
<tbody id="body"></tbody>
<tfoot><tr class="totalrow" id="totalRow"></tr></tfoot>
</table>
</div>
</div>
</div>

<div class="bottom">
<button onclick="addRow()">＋ Add</button>
<button onclick="openReport()">📊 Report</button>
</div>

<div id="modal" class="modal">
<div class="panel" id="panel"></div>
</div>

<script>
const KEY='expense-sheet-mobile-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 persons:['Akshay','Person2','Person3','Person4','Other'],
 headings:['Room Rent','Home Expenses','Petrol','Hospital','Investment','Fast Food','Light Bill'],
 months:{}
};
let current=new Date(); current=new Date(current.getFullYear(),current.getMonth(),1);

function key(){return current.getFullYear()+'-'+String(current.getMonth()+1).padStart(2,'0')}
function data(){return state.months[key()]||(state.months[key()]={rows:state.headings.map(h=>({heading:h,values:{}}))})}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function monthName(){return current.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function changeMonth(n){current=new Date(current.getFullYear(),current.getMonth()+n,1);render()}
function render(){
 const d=data(); state.headings.forEach(h=>{if(!d.rows.some(r=>r.heading===h))d.rows.push({heading:h,values:{}})});
 document.getElementById('monthLabel').textContent=monthName();
 document.getElementById('headRow').innerHTML='<th>Heading</th>'+state.persons.map(p=>'<th>'+esc(p)+'</th>').join('')+'<th>Total</th>';
 let grand=0, body='';
 d.rows.forEach((r,i)=>{
   let rt=0;
   body+='<tr><td><b>'+esc(r.heading)+'</b></td>';
   state.persons.forEach(p=>{
     const v=Number(r.values[p]||0);rt+=v;
     body+='<td class="amount"><input class="cell" inputmode="decimal" type="number" min="0" step="0.01" value="'+(v||'')+'" onchange="setVal('+i+',\''+escAttr(p)+'\',this.value)"></td>';
   });
   grand+=rt;
   body+='<td class="total">'+money(rt)+'</td></tr>';
 });
 document.getElementById('body').innerHTML=body;
 let totals=state.persons.map(p=>d.rows.reduce((s,r)=>s+Number(r.values[p]||0),0));
 document.getElementById('totalRow').innerHTML='<td>TOTAL</td>'+totals.map(x=>'<td class="amount">'+money(x)+'</td>').join('')+'<td class="total">'+money(grand)+'</td>';
 document.getElementById('monthTotal').textContent=money(grand);
 document.getElementById('grandTotal').textContent=money(grand);
 save();
}
function setVal(i,p,v){data().rows[i].values[p]=Number(v||0);render()}
function addRow(){
 const panel=`<h2>Add Expense Heading</h2><div class="field"><label>Heading</label><input id="newHeading" placeholder="e.g. Electricity Bill"></div><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmRow()">Add</button></div>`;
 show(panel)
}
function confirmRow(){const n=document.getElementById('newHeading').value.trim();if(!n)return;if(!state.headings.includes(n)){state.headings.push(n);data().rows.push({heading:n,values:{}});save();render()}closeModal()}
function openPeople(){
 const list=state.persons.map((p,i)=>`<div class="report-row"><span>${esc(p)}</span><button onclick="renamePerson(${i})">✏️</button></div>`).join('');
 show(`<h2>Persons</h2>${list}<div class="actions"><button onclick="addPerson()">＋ Add Person</button><button onclick="closeModal()">Close</button></div>`)
}
function addPerson(){const n=prompt('Enter person name');if(n&&n.trim()&&!state.persons.includes(n.trim())){state.persons.push(n.trim());save();closeModal();render()}}
function renamePerson(i){const n=prompt('Person name',state.persons[i]);if(n&&n.trim()){const old=state.persons[i], neu=n.trim();state.persons[i]=neu;Object.values(state.months).forEach(m=>m.rows.forEach(r=>{if(r.values[old]!==undefined){r.values[neu]=r.values[old];delete r.values[old]}}));save();openPeople();render()}}
function openReport(){
 const d=data(), sums={};d.rows.forEach(r=>sums[r.heading]=state.persons.reduce((s,p)=>s+Number(r.values[p]||0),0));
 const total=Object.values(sums).reduce((a,b)=>a+b,0);
 show(`<h2>Report - ${esc(monthName())}</h2>${Object.entries(sums).map(([k,v])=>`<div class="report-row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}<div class="totalrow report-row"><b>Grand Total</b><b>${money(total)}</b></div><div class="actions"><button onclick="exportCsv()">Export CSV</button><button onclick="closeModal()">Close</button></div>`)
}
function exportCsv(){
 const d=data();let out=[['Heading',...state.persons,'Total']];
 d.rows.forEach(r=>{let vals=state.persons.map(p=>Number(r.values[p]||0));out.push([r.heading,...vals,vals.reduce((a,b)=>a+b,0)])});
 out.push(['TOTAL',...state.persons.map(p=>d.rows.reduce((s,r)=>s+Number(r.values[p]||0),0)),d.rows.reduce((s,r)=>s+state.persons.reduce((a,p)=>a+Number(r.values[p]||0),0),0)]);
 const csv=out.map(row=>row.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Expense_'+key()+'.csv';a.click()
}
function show(x){document.getElementById('panel').innerHTML=x;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escAttr(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();

// PWA install support. Chrome may show "Install app" automatically; this also
// exposes an install button when Chrome provides the install prompt.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  addInstallButton();
});
function addInstallButton(){
  if(document.getElementById('installBtn')) return;
  const b=document.createElement('button');
  b.id='installBtn'; b.textContent='📱 Install App';
  b.className='primary';
  b.onclick=async()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null; b.remove();
  };
  document.querySelector('.toolbar').appendChild(b);
}
window.addEventListener('appinstalled',()=>{ const b=document.getElementById('installBtn'); if(b)b.remove(); });
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
